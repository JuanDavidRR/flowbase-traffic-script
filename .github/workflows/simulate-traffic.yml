name: Simulate traffic

on:
  schedule:
    # Every 3 hours. GitHub Actions cron runs in UTC.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}
    # Lets you trigger a run manually from the Actions tab, useful for
    # testing before waiting on the schedule.

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"

      - name: Install dependencies
        run: npm install

      - name: Install Google Chrome
        run: npx playwright install --with-deps chrome

      - name: Install xvfb (virtual display for headed Chrome on CI)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run traffic simulation (headed via virtual display)
        run: xvfb-run --auto-servernum npm run simulate

      - name: Upload session videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-videos
          path: test-results/videos
          retention-days: 3